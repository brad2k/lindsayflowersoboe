<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/flower.svg" />
    <title>Lindsay Flowers Oboe | Coming soon</title>
    <style>
      :root {
        --bg: #f7f1ea;
        --accent: #a8447a;
        --text: #5c534c;
        --border: rgba(0, 0, 0, 0.08);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        width: 100%;
        max-width: 420px;
        padding: 3rem 2rem;
        border: 1px solid var(--border);
        border-radius: 16px;
        background-color: rgba(255, 255, 255, 0.2);
      }

      .logo {
        width: 72px;
        height: 72px;
        object-fit: contain;
      }

      h1 {
        font-size: 1.75rem;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: var(--text);
      }

      .accent-divider {
        width: 36px;
        height: 2px;
        background-color: var(--accent);
        border-radius: 1px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="flower.svg" alt="Flower logo" class="logo" loading="eager" />

      <h1>Coming soon</h1>

      <div class="accent-divider" aria-hidden="true"></div>
    </main>
  </body>
</html>
